name: Integration (live SaaS, read-only)

# Runs the read-only integration suite against the Camunda SaaS organisation behind the
# CAMUNDA_CONSOLE_CLIENT_ID / CAMUNDA_CONSOLE_CLIENT_SECRET repository secrets, with response
# validation on, to detect mismatches between the published spec and real responses.
#
# Not run on pull requests: PR code would run with the organisation's credentials.
on:
  push:
    branches:
      - main
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The OAuth endpoint is rate limited per source IP; never run two suites at once.
  group: integration-live
  cancel-in-progress: false

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: 'npm'
      - run: npm ci
      - name: Check credentials are configured
        env:
          CAMUNDA_CONSOLE_CLIENT_ID: ${{ secrets.CAMUNDA_CONSOLE_CLIENT_ID }}
          CAMUNDA_CONSOLE_CLIENT_SECRET: ${{ secrets.CAMUNDA_CONSOLE_CLIENT_SECRET }}
        run: |
          if [ -z "$CAMUNDA_CONSOLE_CLIENT_ID" ] || [ -z "$CAMUNDA_CONSOLE_CLIENT_SECRET" ]; then
            echo '::error::Repository secrets CAMUNDA_CONSOLE_CLIENT_ID and CAMUNDA_CONSOLE_CLIENT_SECRET must be set.'
            exit 1
          fi
      - name: Read-only integration suite
        env:
          CAMUNDA_CONSOLE_CLIENT_ID: ${{ secrets.CAMUNDA_CONSOLE_CLIENT_ID }}
          CAMUNDA_CONSOLE_CLIENT_SECRET: ${{ secrets.CAMUNDA_CONSOLE_CLIENT_SECRET }}
        run: npm run test:integration
