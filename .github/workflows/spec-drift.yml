name: Upstream spec drift

# The Console API spec is published by the SaaS service, not versioned in a repo, so it can
# change at any time. Check daily and fail visibly when the published spec differs from the
# committed snapshot.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spec-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: "npm"
      - run: npm ci
      - run: npm run spec:check

  notify-failure:
    needs: [spec-check]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    permissions: {}
    uses: camunda/sdk-infra/.github/workflows/sdk-slack-notify.yml@v1
    with:
      repo-name: console-api-js
      workflow-name: Upstream spec drift
      mention-group: ${{ vars.SLACK_MENTION_GROUP }}
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_SDK_ALERTS }}
