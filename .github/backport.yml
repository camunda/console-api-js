# Backport configuration for camunda/sdk-infra's sdk-backport.yml
# (schema: https://github.com/camunda/sdk-infra/blob/main/schema/backport.schema.json).
# Read from the TARGET branch. There is no stable branch yet: a stable/N cut from
# main inherits this file, which is what makes backports to it work.
language: js

# Derived from the spec or the generator. Restored from the target branch and
# regenerated there.
generated-paths:
  - spec
  - src/gen

# Regenerates from the committed spec (generate:offline doesn't fetch), then
# typechecks and runs the unit tests against the regenerated client.
regenerate: npm ci && npm run generate:offline && npm run typecheck && npm test
